<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matylda House - Wygaszacz</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Wideo w tle zoptymalizowane pod kątem wydajności mobilnej */
        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }
        /* Ciemna nakładka bez ciężkich efektów graficznych */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        /* Statyczny kontener logo – brak jakichkolwiek animacji i poświaty, maksymalny rozmiar */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-container img {
            max-width: 850px;
            width: 85vw;
            height: auto;
            /* Usunięto filtry, poświatę i cienie, aby tablet renderował grafikę całkowicie płynnie */
        }
        /* Minimalistyczny, lekki przycisk */
        .tap-button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.9);
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1.5px;
            border-radius: 30px;
            text-transform: uppercase;
        }
        .tap-button:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Wideo w tle -->
    <video autoplay muted loop playsinline webkit-playsinline>
        <source src="wygaszacz.mp4" type="video/mp4">
    </video>

    <!-- Centralna nakładka z dużym, czystym logo bez poświaty i animacji -->
    <div class="overlay" onclick="exitScreensaver()">
        <div class="logo-container">
            <img src="Przezroczysty_6.png" alt="Matylda House">
        </div>
        <div class="tap-button">Dotknij, aby rozpocząć</div>
    </div>

    <script>
        function exitScreensaver() {
            if (typeof window.fully !== 'undefined' && typeof window.fully.stopScreenSaver === 'function') {
                window.fully.stopScreenSaver();
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
